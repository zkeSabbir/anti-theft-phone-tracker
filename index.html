<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisGuard | Military-Grade Anti-Theft & Telemetry</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet Map & PeerJS P2P Cloud Sync -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-base: #06080F;
            --bg-card: rgba(14, 20, 36, 0.75);
            --bg-card-hover: rgba(22, 32, 58, 0.85);
            --border-glow: rgba(56, 189, 248, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --danger: #f43f5e;
            --danger-glow: rgba(244, 63, 94, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            height: 100vh;
            width: 100vw;
            background: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
        }

        #sidebar {
            width: 440px;
            height: 100vh;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 10px 0 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 12, 22, 0.6);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 0.72rem;
            color: var(--text-faint);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 99px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .section-wrap {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-faint);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: rgba(18, 26, 46, 0.6);
            color: var(--text-main);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-action i {
            font-size: 1rem;
            width: 22px;
            color: var(--primary);
            transition: transform 0.2s;
        }

        .btn-action:hover {
            background: rgba(30, 41, 69, 0.9);
            border-color: var(--primary);
            box-shadow: 0 4px 20px var(--primary-glow);
            transform: translateY(-2px);
        }

        .btn-action:hover i {
            transform: scale(1.15);
        }

        .btn-action.danger {
            border-color: rgba(244, 63, 94, 0.3);
            background: rgba(244, 63, 94, 0.08);
        }

        .btn-action.danger i {
            color: var(--danger);
        }

        .btn-action.danger:hover {
            background: rgba(244, 63, 94, 0.25);
            border-color: var(--danger);
            box-shadow: 0 4px 20px var(--danger-glow);
        }

        .telemetry-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .telemetry-card {
            background: rgba(18, 26, 46, 0.4);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            transition: border-color 0.2s;
        }

        .telemetry-card:hover {
            border-color: var(--border-glow);
        }

        .telemetry-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .telemetry-value {
            font-size: 1.15rem;
            font-weight: 800;
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
        }

        .feed-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 18px 24px 24px;
        }

        .feed-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feed-list::-webkit-scrollbar {
            width: 5px;
        }
        .feed-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .feed-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .event-card {
            background: rgba(18, 26, 46, 0.5);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 16px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .event-card:hover {
            border-color: var(--border-glow);
            transform: translateX(3px);
            background: rgba(22, 32, 58, 0.7);
        }

        .event-card.intruder {
            border-color: rgba(244, 63, 94, 0.4);
            background: linear-gradient(135deg, rgba(38, 12, 22, 0.7), rgba(20, 10, 18, 0.5));
            box-shadow: 0 4px 25px rgba(244, 63, 94, 0.15);
        }

        .event-card.intruder::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--danger);
            box-shadow: 0 0 12px var(--danger);
        }

        .event-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .event-tag {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .event-tag.danger {
            background: rgba(244, 63, 94, 0.2);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .event-tag.info {
            background: rgba(56, 189, 248, 0.15);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .event-time {
            font-size: 0.72rem;
            color: var(--text-faint);
            font-family: 'JetBrains Mono', monospace;
        }

        .event-coords {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .event-photo {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 12px;
            border: 1px solid rgba(244, 63, 94, 0.4);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .event-photo:hover {
            transform: scale(1.02);
        }

        #map {
            flex: 1;
            height: 100vh;
            background: #06080F;
        }

        .map-overlay-card {
            position: absolute;
            top: 24px;
            right: 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 12px 18px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .map-mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-mode-btn:hover {
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }

        .map-mode-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border-color: rgba(56, 189, 248, 0.3);
            font-weight: 700;
        }

        #photoModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        #modalImg {
            max-width: 85%;
            max-height: 85%;
            border-radius: 16px;
            border: 2px solid var(--danger);
            box-shadow: 0 0 50px rgba(244, 63, 94, 0.4);
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <!-- Brand Header -->
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="brand-text">
                    <h1>AegisGuard</h1>
                    <p>TACTICAL ASSET RECOVERY</p>
                </div>
            </div>
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>ONLINE</span>
            </div>
        </div>

        <!-- Remote Defense Protocol -->
        <div class="section-wrap">
            <div class="section-label">
                <span>Remote Protocols</span>
                <i class="fa-solid fa-satellite-dish"></i>
            </div>
            <div class="action-grid">
                <button class="btn-action danger" onclick="triggerCommand('SIREN')">
                    <i class="fa-solid fa-bullhorn"></i>
                    <span>Siren Alarm</span>
                </button>
                <button class="btn-action" onclick="triggerCommand('SNAP_PHOTO')">
                    <i class="fa-solid fa-camera"></i>
                    <span>Intruder Snap</span>
                </button>
                <button class="btn-action" onclick="triggerCommand('FAKEOFF')">
                    <i class="fa-solid fa-power-off"></i>
                    <span>Fake Shutdown</span>
                </button>
                <button class="btn-action" onclick="triggerCommand('FLASH_LIGHT')">
                    <i class="fa-solid fa-flashlight"></i>
                    <span>Flash Beacon</span>
                </button>
            </div>
        </div>

        <!-- Telemetry Data -->
        <div class="telemetry-row">
            <div class="telemetry-card">
                <div class="telemetry-label">Battery Level</div>
                <div class="telemetry-value" id="val-batt">92%</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Current Velocity</div>
                <div class="telemetry-value" id="val-speed">0 km/h</div>
            </div>
            <div class="telemetry-card">
                <div class="telemetry-label">Power State</div>
                <div class="telemetry-value" id="val-charge">CHARGING ⚡</div>
            </div>
        </div>

        <!-- Security Intel Feed -->
        <div class="feed-container">
            <div class="section-label">
                <span>Security Intel & Capture Logs</span>
                <span id="log-count" style="font-family:'JetBrains Mono'; color:var(--primary);">3 ENTRIES</span>
            </div>
            <div class="feed-list" id="feed-list"></div>
        </div>
    </aside>

    <!-- Map Viewport -->
    <main id="map"></main>

    <!-- Map Overlays -->
    <div class="map-overlay-card">
        <button class="map-mode-btn active" id="btn-dark" onclick="setMapTheme('dark')"><i class="fa-solid fa-moon"></i> Cyber</button>
        <button class="map-mode-btn" id="btn-sat" onclick="setMapTheme('satellite')"><i class="fa-solid fa-satellite"></i> Satellite</button>
        <button class="map-mode-btn" onclick="centerOnTarget()"><i class="fa-solid fa-crosshairs"></i> Target</button>
        <button class="map-mode-btn" onclick="configureBackend()" title="Set Python Backend URL"><i class="fa-solid fa-server"></i> Server</button>
    </div>

    <!-- Fullscreen Intruder Modal -->
    <div id="photoModal" onclick="this.style.display='none'">
        <img id="modalImg" src="">
    </div>

    <script>
        var API_BASE_URL = localStorage.getItem('AEGIS_BACKEND_URL') || '';

        function configureBackend() {
            var url = prompt("Enter your Live Server URL (ngrok, tunnel, or IP):", API_BASE_URL);
            if (url !== null) {
                API_BASE_URL = url.trim().replace(/\/$/, '');
                localStorage.setItem('AEGIS_BACKEND_URL', API_BASE_URL);
                alert("Server updated: " + (API_BASE_URL || "Local / Demo"));
                pollTelemetry();
            }
        }

        // Leaflet Map Init (CartoDB Dark Theme)
        var map = L.map('map', { zoomControl: false }).setView([23.8103, 90.4125], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Free Dark Cyber Map (Stadia Alidade Smooth Dark / OpenStreetMap without API Key watermark)
        var darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd',
            attribution: '&copy; OpenStreetMap'
        });

        // Alidade Smooth Dark - Crisp Cyber Theme without watermark
        var cyberDarkLayer = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; Stadia Maps'
        });

        // Esri Satellite View (100% Free & High Resolution)
        var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: '&copy; Esri'
        });

        cyberDarkLayer.addTo(map);

        function setMapTheme(theme) {
            document.getElementById('btn-dark').classList.remove('active');
            document.getElementById('btn-sat').classList.remove('active');
            if (theme === 'dark') {
                map.removeLayer(satLayer);
                cyberDarkLayer.addTo(map);
                document.getElementById('btn-dark').classList.add('active');
            } else {
                map.removeLayer(cyberDarkLayer);
                satLayer.addTo(map);
                document.getElementById('btn-sat').classList.add('active');
            }
        }

        // Custom Neon Pulse Marker
        var pulseIcon = L.divIcon({
            className: 'custom-pulse-marker',
            html: `
                <div style="position:relative; width:22px; height:22px;">
                    <div style="position:absolute; width:100%; height:100%; background:#38bdf8; border-radius:50%; box-shadow:0 0 20px #38bdf8; border:3px solid #fff;"></div>
                    <div style="position:absolute; width:100%; height:100%; background:#38bdf8; border-radius:50%; animation:markerPulse 2s infinite; opacity:0.6;"></div>
                </div>
                <style>
                    @keyframes markerPulse {
                        0% { transform: scale(1); opacity: 0.8; }
                        100% { transform: scale(3.5); opacity: 0; }
                    }
                </style>
            `,
            iconSize: [22, 22],
            iconAnchor: [11, 11]
        });

        var targetMarker = null;
        var trajectoryPath = L.polyline([], {
            color: '#38bdf8',
            weight: 4,
            opacity: 0.85,
            dashArray: '8, 8',
            lineCap: 'round'
        }).addTo(map);

        var lastTargetPos = null;

        function centerOnTarget() {
            if (lastTargetPos) {
                map.flyTo(lastTargetPos, 17, { duration: 1.5 });
            }
        }

        // --- P2P Direct Cloud Connection to Mobile (No Python Server Needed!) ---
        var peer = new Peer('aegis-dashboard-master-host');
        var mobileConn = null;

        peer.on('open', function(id) {
            console.log("Dashboard Master P2P ready:", id);
            // মোবাইলের সাথে কানেক্ট করার চেষ্টা
            connectToMobileDevice();
        });

        function connectToMobileDevice() {
            var conn = peer.connect('aegis-mobile-phone-device');
            conn.on('open', function() {
                mobileConn = conn;
                console.log("Connected directly to Honor mobile!");
                document.querySelector('.status-badge span:last-child').innerText = "LIVE P2P PHONE";
            });
            conn.on('data', function(data) {
                console.log("Live Phone Telemetry Received:", data);
                handleLivePhoneData(data);
            });
        }

        setInterval(function() {
            if (!mobileConn || !mobileConn.open) {
                connectToMobileDevice();
            }
        }, 5000);

        function handleLivePhoneData(data) {
            var customLog = {
                lat: data.lat,
                lon: data.lon,
                speed: data.speed,
                battery: data.battery,
                charging: data.charging,
                timestamp: data.timestamp,
                event_type: data.event_type,
                photo_data: data.photo_data
            };
            var current = [customLog].concat(defaultTelemetry);
            renderLogs(current);
            if (data.lat && data.lon) {
                map.flyTo([data.lat, data.lon], 17);
            }
        }

        function triggerCommand(cmd) {
            if (mobileConn && mobileConn.open) {
                mobileConn.send({command: cmd});
                alert(`🚀 DIRECT COMMAND SENT TO PHONE: ${cmd}`);
                return;
            }
            var endpoint = (API_BASE_URL || '') + '/api/command';
            fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({command: cmd})
            })
            .then(r => r.json())
            .then(data => alert(`🚀 DISPATCHED: ${cmd}`))
            .catch(() => alert(`Command ${cmd} queued.`));
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('photoModal').style.display = 'flex';
        }

        // Sample initial telemetry data so Netlify renders beautifully immediately
        var defaultTelemetry = [
            {
                lat: 23.8103,
                lon: 90.4125,
                speed: 12,
                battery: 92,
                charging: 1,
                timestamp: "2026-10-08 23:10:45",
                event_type: "WRONG_PIN",
                photo_filename: "sample_intruder.jpg"
            },
            {
                lat: 23.8080,
                lon: 90.4100,
                speed: 18,
                battery: 93,
                charging: 0,
                timestamp: "2026-10-08 23:05:12",
                event_type: "LIVE_GPS"
            },
            {
                lat: 23.8050,
                lon: 90.4070,
                speed: 0,
                battery: 94,
                charging: 0,
                timestamp: "2026-10-08 22:58:30",
                event_type: "LIVE_GPS"
            }
        ];

        function renderLogs(logs) {
            var latest = logs[0];
            document.getElementById('val-batt').innerText = (latest.battery ? latest.battery + '%' : '92%');
            document.getElementById('val-speed').innerText = (latest.speed ? latest.speed + ' km/h' : '0 km/h');
            document.getElementById('val-charge').innerText = latest.charging ? 'CHARGING ⚡' : 'DISCHARGING';
            document.getElementById('log-count').innerText = `${logs.length} EVENTS`;

            if (latest.lat && latest.lon) {
                var latLng = [latest.lat, latest.lon];
                lastTargetPos = latLng;

                if (!targetMarker) {
                    targetMarker = L.marker(latLng, { icon: pulseIcon }).addTo(map);
                    map.setView(latLng, 15);
                } else {
                    targetMarker.setLatLng(latLng);
                }

                var points = logs.filter(l => l.lat && l.lon).map(l => [l.lat, l.lon]);
                trajectoryPath.setLatLngs(points);
            }

            var feed = document.getElementById('feed-list');
            feed.innerHTML = '';

            logs.forEach(item => {
                var isIntruder = item.event_type === 'WRONG_PIN' || !!item.photo_filename;
                var card = document.createElement('div');
                card.className = 'event-card' + (isIntruder ? ' intruder' : '');

                var tagClass = isIntruder ? 'danger' : 'info';
                var tagText = isIntruder ? '🚨 Intruder Detected' : '📍 GPS Ping';

                var photoUrl = item.photo_filename 
                    ? (item.photo_filename === 'sample_intruder.jpg' 
                        ? 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80' 
                        : (API_BASE_URL || '') + '/photos/' + item.photo_filename)
                    : null;

                var photoMarkup = photoUrl 
                    ? `<img class="event-photo" src="${photoUrl}" onclick="openModal(this.src)" title="Click to enlarge" />`
                    : '';

                card.innerHTML = `
                    <div class="event-top">
                        <span class="event-tag ${tagClass}">${tagText}</span>
                        <span class="event-time">${item.timestamp}</span>
                    </div>
                    <div class="event-coords">
                        <i class="fa-solid fa-location-dot" style="color:var(--primary);"></i>
                        <span>${Number(item.lat).toFixed(5)}, ${Number(item.lon).toFixed(5)}</span>
                        <span style="margin-left:auto; color:var(--text-faint);">${item.speed ? item.speed + ' km/h' : ''}</span>
                    </div>
                    ${photoMarkup}
                `;
                feed.appendChild(card);
            });
        }

        function pollTelemetry() {
            var endpoint = (API_BASE_URL || '') + '/api/logs';
            fetch(endpoint)
            .then(r => r.json())
            .then(logs => {
                if (logs && logs.length > 0) renderLogs(logs);
                else renderLogs(defaultTelemetry);
            })
            .catch(() => {
                renderLogs(defaultTelemetry);
            });
        }

        renderLogs(defaultTelemetry);
        setInterval(pollTelemetry, 4000);
    </script>
</body>
</html>
